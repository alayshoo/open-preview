[package]
name = "open-preview"
version = "0.3.0"
edition = "2024"
description = "A minimal, modern video player built on libmpv"
license = "0BSD"
repository = "https://github.com/alayshoo/open-preview"

[workspace]
members = [".", "thumbnailer"]

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.37"
libloading = "0.9.0"
raw-window-handle = "0.6"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
strip = true
lto = "thin"
