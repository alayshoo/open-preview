name: CI

# Every push and pull request is linted. Every push also builds the Windows
# installer and attaches it to the run; pushing a version tag (v0.3.0, matching
# Cargo.toml) publishes it as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain, components and targets pinned in rust-toolchain.toml.
      - run: rustup toolchain install || rustup show
      # windres, for embedding the icon when checking the Windows target.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (Linux)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (Windows)
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  installer:
    name: Windows installer
    needs: lint
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install || rustup show
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 wixl msitools p7zip-full
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi
      - name: Build the MSI
        run: scripts/build-msi.sh
      - uses: actions/upload-artifact@v5
        with:
          name: open-preview-installer
          path: dist/*.msi
          if-no-files-found: error
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.msi
          generate_release_notes: true
