name: CI

# Every push and pull request is linted. Every push also builds the Windows
# installer and attaches it to the run. A push to main whose Cargo.toml version
# has no tag yet tags it (v0.3.0) and publishes the installer as a GitHub
# Release, so bumping the version is all a release takes. Pushing a version tag
# by hand publishes it the same way.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain, components and targets pinned in rust-toolchain.toml.
      - run: rustup toolchain install || rustup show
      # windres, for embedding the icon when checking the Windows target.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (Linux)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (Windows)
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  installer:
    name: Windows installer
    needs: lint
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install || rustup show
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 wixl msitools p7zip-full
      - uses: Swatinem/rust-cache@v2
      - name: Decide whether to release
        id: release
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
              exit 1
            fi
            publish=true
          elif [ "$GITHUB_REF_NAME" = main ] && [ -z "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            publish=true
          else
            publish=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Build the MSI
        run: scripts/build-msi.sh
      - uses: actions/upload-artifact@v5
        with:
          name: open-preview-installer
          path: dist/*.msi
          if-no-files-found: error
      # Creates the tag on this commit when it doesn't exist yet. Tags made with
      # the workflow's token don't trigger another run, so nothing builds twice.
      - name: Publish the release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*.msi
          generate_release_notes: true
