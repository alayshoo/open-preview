[package]
name = "open-preview-thumbs"
version = "0.3.0"
edition = "2024"
description = "Explorer thumbnail handler for Open Preview"
license = "0BSD"
publish = false

[lib]
name = "open_preview_thumbs"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
